{% extends "base.html" %}
{% block title %}Web App Manager — Home{% endblock %}

{% block content %}
<!-- ① App Catalog Grid -->
<div class="card section-card mb-4">
    <div class="card-body">
        <h5 class="card-title mb-1"><i class="fas fa-th-large me-2 text-secondary"></i>Available Applications</h5>
        <p class="text-muted small mb-3">Click an icon to create a new instance.</p>
        <div class="app-icon-grid" id="appIconGrid">
            <!-- Tiles injected by JS from /api/apps/registry -->
        </div>
    </div>
</div>

<!-- ② Running Instances -->
<div class="card section-card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0"><i class="fas fa-layer-group me-2 text-secondary"></i>Your Instances</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadInstances()">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
        </div>
        <div id="instanceList">
            <p class="text-muted small" id="noInstancesMsg">No instances yet. Create one above.</p>
        </div>
    </div>
</div>

<!-- ③ Create Confirmation Modal -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <div class="d-flex align-items-center gap-3">
                    <div class="app-icon-circle modal-icon-circle" id="modalIconCircle">
                        <i id="modalIcon"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold" id="modalAppName"></h6>
                        <small class="text-muted">Create new instance</small>
                    </div>
                </div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2">
                <p class="text-muted small mb-0" id="modalAppDesc"></p>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" id="modalCreateBtn">
                    <i class="fas fa-plus me-1"></i>Create
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let _registry = [];
let _createModal = null;
let _pendingType = null;

// ---- Registry / Grid ----
async function loadRegistry() {
    try {
        const res = await axios.get('/api/apps/registry');
        _registry = res.data.registry;
        renderGrid();
    } catch (e) {
        console.error('Failed to load registry', e);
    }
}

function renderGrid() {
    const grid = document.getElementById('appIconGrid');
    grid.innerHTML = '';
    _registry.forEach(app => {
        const tile = document.createElement('button');
        tile.className = 'app-icon-tile';
        tile.innerHTML = `
            <div class="app-icon-circle"
                 style="background: linear-gradient(135deg, ${app.color_from}, ${app.color_to})">
                <i class="${app.icon}"></i>
            </div>
            <span class="app-icon-label">${app.display_name}</span>`;
        tile.addEventListener('click', () => openCreateModal(app));
        grid.appendChild(tile);
    });
}

function openCreateModal(app) {
    _pendingType = app.type_name;
    document.getElementById('modalAppName').textContent = app.display_name;
    document.getElementById('modalAppDesc').textContent = app.description;
    document.getElementById('modalIcon').className = app.icon;
    const circle = document.getElementById('modalIconCircle');
    circle.style.background = `linear-gradient(135deg, ${app.color_from}, ${app.color_to})`;
    _createModal.show();
}

document.getElementById('modalCreateBtn').addEventListener('click', async () => {
    try {
        const res = await axios.post('/api/apps', { app_type: _pendingType });
        _createModal.hide();
        window.location.href = `/app/${res.data.app_id}`;
    } catch (e) {
        alert(e.response?.data?.error || 'Failed to create instance');
    }
});

// ---- Instances List ----
async function loadInstances() {
    try {
        const res = await axios.get('/api/apps');
        const apps = res.data.apps;
        const list = document.getElementById('instanceList');
        const noMsg = document.getElementById('noInstancesMsg');
        const entries = Object.entries(apps);
        if (entries.length === 0) {
            list.innerHTML = '';
            noMsg.style.display = '';
            return;
        }
        noMsg.style.display = 'none';
        list.innerHTML = '';
        entries.forEach(([appId, info]) => {
            const appType = info.status.app_type || '';
            const meta = _registry.find(r => r.type_name === appType) || {};
            const isRunning = info.is_running;
            const row = document.createElement('div');
            row.className = 'instance-row';
            row.innerHTML = `
                <div class="instance-icon-sm"
                     style="background: linear-gradient(135deg, ${meta.color_from||'#90a4ae'}, ${meta.color_to||'#546e7a'})">
                    <i class="${meta.icon||'fas fa-cube'}"></i>
                </div>
                <div class="instance-info">
                    <div class="fw-semibold small">${meta.display_name || appType}</div>
                    <div class="instance-id">${appId}</div>
                </div>
                <span class="badge ${isRunning ? 'bg-success' : 'bg-secondary'} me-2">
                    ${isRunning ? 'running' : 'stopped'}
                </span>
                <a href="/app/${appId}" class="btn btn-sm btn-outline-primary me-1">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteInstance('${appId}', this)">
                    <i class="fas fa-trash"></i>
                </button>`;
            list.appendChild(row);
        });
    } catch (e) {
        console.error('Failed to load instances', e);
    }
}

async function deleteInstance(appId, btn) {
    if (!confirm('Delete this instance?')) return;
    try {
        await axios.delete(`/api/apps/${appId}`);
        loadInstances();
    } catch (e) {
        alert(e.response?.data?.error || 'Delete failed');
    }
}

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
    _createModal = new bootstrap.Modal(document.getElementById('createModal'));
    loadRegistry().then(() => loadInstances());
});
</script>
{% endblock %}
